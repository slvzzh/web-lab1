<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интернет-магазин</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1>Магазин</h1>
        <button id="cart-btn" class="cart-btn">Корзина (<span id="cart-count">0</span>)</button>
    </header>

    <main class="container">
        <section class="products" id="products">
            <!-- Карточки товаров генерируются через JS -->
        </section>
    </main>

    <!-- Корзина (модальное окно) -->
    <div id="cart-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close" id="close-cart">&times;</span>
            <h2>Ваша корзина</h2>
            <div id="cart-items"></div>
            <p class="total">Итого: <span id="cart-total">0</span> ₽</p>
            <button id="checkout-btn" class="btn-primary">Оформить заказ</button>
        </div>
    </div>

    <!-- Форма оформления заказа -->
    <div id="order-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close" id="close-order">&times;</span>
            <h2>Оформление заказа</h2>
            <form id="order-form">
                <label>Имя <input type="text" id="first-name" required></label>
                <label>Фамилия <input type="text" id="last-name" required></label>
                <label>Адрес доставки <input type="text" id="address" required></label>
                <label>Контактный телефон <input type="tel" id="phone" required></label>
                <button type="submit" class="btn-primary">Создать заказ</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
